name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: run tests for Arena in C 
      working-directory: ./ArenaC
      run: 
        make dir 
        make tests
        make cleanup
