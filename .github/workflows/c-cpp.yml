name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: ./ArenaC

    steps:
    - uses: actions/checkout@v4
    - name: Install C dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Create bin directory
      run: make dir 
    - name: Run tests
      run: make tests 
    - name: Cleanup all the obj & bin files
      run: make clean

